<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <h1 class="logo brand">NETFLIX</h1>

        <nav aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#popular">Popular</a>
        </nav>

        <div class="account-area">
            <span id="welcomeUser" hidden></span>
            <button id="signInButton" onclick="signIn()">Sign In</button>
            <button id="signOutButton" onclick="signOut()" hidden>Sign Out</button>
        </div>
    </header>

    <section class="hero banner" id="hero">
        <div class="hero-content">
            <h1 id="heroTitle">Welcome to Netflix</h1>
            <p id="heroDescription">
                Discover your favourite movies and entertainment.
            </p>

            <div class="hero-actions">
                <button class="primary-button" onclick="playHeroTrailer()">Watch Trailer</button>
                <button class="secondary-button" onclick="getStarted()">Explore Movies</button>
            </div>
        </div>
        <div id="heroTrailer"></div>
    </section>

    <main id="movies" class="catalog movies-section movie-section">
        <h2 id="popular">Explore Movies</h2>
        <p id="tmdbStatus" class="tmdb-status" role="status" aria-live="polite">
            Loading movies...
        </p>
        <p id="movieCount" class="movie-count" aria-live="polite">0 movies</p>
        <div id="movieSections">
            <div id="movieContainer" class="movie-container movie-row">
                <p>Loading movies...</p>
            </div>
        </div>
        <p id="emptyState" class="empty-state" hidden>No movies found.</p>
    </main>

    <div id="loginModal" class="modal modal-backdrop" hidden>
        <section class="modal-content login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
            <button class="close close-modal" type="button" onclick="closeLogin()" aria-label="Close sign in">×</button>
            <h2 id="loginTitle">Sign In</h2>
            <form id="loginForm">
                <label>
                    Email
                    <input type="email" id="email" placeholder="Enter Email" required autocomplete="email">
                </label>
                <label>
                    Password
                    <input type="password" id="password" placeholder="Enter Password" required minlength="4" autocomplete="current-password">
                </label>
                <p id="loginError" class="login-error" role="alert"></p>
                <button type="submit">Sign In</button>
            </form>
        </section>
    </div>

    <div id="trailerModal" class="modal modal-backdrop" hidden>
        <section class="trailer-content" role="dialog" aria-modal="true" aria-labelledby="trailerTitle">
            <button class="close close-modal" type="button" onclick="closeTrailer()" aria-label="Close trailer">×</button>
            <h2 id="trailerTitle">Movie trailer</h2>
            <div id="trailerPlayer"></div>
        </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer>
        <p>Netflix Clone | Powered by TMDb API</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
